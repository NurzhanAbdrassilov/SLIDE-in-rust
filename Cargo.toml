[package]
name = "slide-in-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "test_rocksdb"
path = "src/test_rocksdb.rs"

[dependencies]
lazy_static = "1.4"
crc32fast = "1.3"
rand = "0.8"
num-complex = "0.4"
flate2 = "1.0"
zip = "0.6"
rocksdb = "0.22"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
tempfile = "3.10"